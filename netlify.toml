[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"

  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/manifest.webmanifest"

  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache"

[dev]
  framework = "expo"
  targetPort = 8081
  port = 8888

# /version.json SIEMPRE debe consultarse en la red, sin caché de Safari/iOS,
# Netlify ni del service worker.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Content-Type = "application/json; charset=utf-8"

# Asegura que la página de entrada compruebe una compilación nueva.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
