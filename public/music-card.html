<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Escucha música con Shopp</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px system-ui,
          -apple-system,
          Arial;
        background: #f1f5f9;
        color: #0f172a;
      }
      main {
        max-width: 480px;
        margin: 35px auto;
        padding: 25px;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 4px 24px #0f172a18;
        text-align: center;
      }
      h1 {
        margin: 4px 0 10px;
        color: #2563eb;
      }
      h2 {
        font-size: 21px;
        margin: 14px 0 4px;
      }
      p {
        color: #475569;
      }
      .media {
        width: 80%;
        max-width: 260px;
        aspect-ratio: 16 / 9;
        margin: 16px auto;
        border-radius: 10px;
        overflow: hidden;
        background: #0f172a;
      }
      .media img,
      .media iframe {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        object-fit: cover;
      }
      .play-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin-top: 12px;
      }
      .play-actions > .action {
        appearance: none;
        -webkit-appearance: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        margin: 0;
        padding: 15px 20px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        font:
          700 16px/22px system-ui,
          -apple-system,
          Arial,
          sans-serif;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
      }
      .play-actions > #youtube {
        background: #dc2626;
      }
      .play-actions > #shopp {
        background: #2563eb;
      }
      .player-note {
        font-size: 13px;
      }
      #lyric { min-height: 25px; color: #a16207; font-weight: 650; font-style: italic; margin: 12px 0; }
      [hidden] {
        display: none !important;
      }
      .info {
        font-size: 13px;
      }
      .error {
        color: #b91c1c;
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shopp Music</h1>
      <p>Una canción para compartir contigo</p>
      <div id="media" class="media" hidden>
        <img id="cover" alt="Portada del vídeo" hidden />
        <iframe
          id="player"
          hidden
          title="Reproductor de YouTube"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>
      <h2 id="title">Cargando…</h2>
      <p id="author"></p>
      <p id="detail"></p>
      <div class="play-actions">
        <a
          id="youtube"
          class="action"
          hidden
          rel="noopener noreferrer"
          target="_blank"
          >Abrir en YouTube</a
        ><button id="shopp" type="button" class="action shopp" hidden>
          Reproducir aquí
        </button>
      </div>
      <p id="lyric" hidden aria-live="off"></p>
      <p id="player-note" class="player-note" hidden>
        Si el vídeo no permite reproducción integrada, utiliza «Abrir en
        YouTube».
      </p>
      <p class="info">
        La reproducción puede requerir tocar el botón de reproducir.
      </p>
      <p id="error" class="error" role="alert"></p>
      <footer>Shopp · Música y Classical Music</footer>
    </main>
    <script>
      (() => {
        "use strict";
        const q = new URLSearchParams(location.search),
          videoRe = /^[\w-]{11}$/,
          listRe = /^[\w-]{10,120}$/,
          publicRe = /^[a-z0-9][a-z0-9-]{5,63}$/;
        const $ = (id) => document.getElementById(id);
        const err = (msg) => {
          $("title").textContent = "Tarjeta no disponible";
          $("error").textContent = msg;
          $("youtube").hidden = true;
          $("shopp").hidden = true;
        };
        const show = (t, a, v, list, detail) => {
          $("title").textContent = String(t || "Música compartida").slice(
            0,
            120,
          );
          $("author").textContent = String(a || "").slice(0, 100);
          $("detail").textContent = detail || "";
          $("youtube").href = v
            ? `https://www.youtube.com/watch?v=${v}`
            : `https://www.youtube.com/playlist?list=${list}`;
          $("youtube").textContent = detail
            ? "Escuchar primer tema en YouTube"
            : "Abrir en YouTube";
          $("youtube").hidden = false;
          $("media").hidden = !v;
          if (v) {
            $("cover").src = `https://i.ytimg.com/vi/${v}/hqdefault.jpg`;
            $("cover").hidden = false;
          }
          const embed = v
            ? `https://www.youtube-nocookie.com/embed/${v}?playsinline=1&rel=0`
            : `https://www.youtube-nocookie.com/embed/videoseries?list=${list}&playsinline=1`;
          $("shopp").onclick = () => {
            // Sustituir la carátula en su mismo contenedor, sin mover el diseño.
            $("cover").hidden = true;
            $("media").hidden = false;
            $("player").hidden = false;
            $("player").src = embed;
            $("player-note").hidden = false;
            $("shopp").hidden = true;
          };
          $("shopp").hidden = false;
        };
        // Fase 2: tarjetas permanentes almacenadas en Convex (sin JSON en public).
        const cardId = q.get("card");
        if (cardId !== null) {
          if (!/^card-[a-z0-9-]{12,70}$/.test(cardId)) { err("Identificador de tarjeta inválido."); return; }
          fetch(`/.netlify/functions/publicMusicCard?id=${encodeURIComponent(cardId)}`, { cache: "no-store" })
            .then(async response => {
              if (!response.ok) throw new Error(response.status === 404 ? "Esta tarjeta no está publicada en el Convex de Netlify." : `No se pudo cargar la tarjeta (HTTP ${response.status}).`);
              return response.json();
            })
            .then(card => {
              if (card.id !== cardId || !videoRe.test(card.videoId || "")) throw new Error("Ficha inválida.");
              show(card.title, card.author, card.videoId, "", "");
              if (typeof card.lyrics === "string" && card.lyrics.trim()) {
                const lines = card.lyrics.split(/\r?\n/).map(line => {
                  const match = line.match(/^\[(\d{1,3}):(\d{2})(?:[.,](\d{1,3}))?\](.*)$/);
                  if (!match) return null;
                  const fraction = match[3] ? Number(`0.${match[3]}`) : 0;
                  return { at: Number(match[1]) * 60 + Number(match[2]) + fraction, text: match[4].trim() };
                }).filter(Boolean).sort((a,b)=>a.at-b.at);
                if (lines.length) {
                  const lyric = $("lyric"); lyric.hidden = false;
                  lyric.textContent = "Letra sincronizada disponible al reproducir";
                  // IFrame API reads current playback time on permitted YouTube embeds.
                  const oldClick = $("shopp").onclick;
                  $("shopp").onclick = () => {
                    oldClick();
                    $("player").src = `https://www.youtube-nocookie.com/embed/${card.videoId}?enablejsapi=1&origin=${encodeURIComponent(location.origin)}&playsinline=1&rel=0`;
                    let seconds = 0, lastIndex = -1;
                    const frame = $("player");
                    const listener = (event) => {
                      if (!/^https:\/\/(www\.)?youtube(-nocookie)?\.com$/.test(event.origin) || event.source !== frame.contentWindow) return;
                      let msg; try { msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data; } catch { return; }
                      if (msg?.event === "infoDelivery" && Number.isFinite(msg.info?.currentTime)) seconds = msg.info.currentTime;
                    };
                    window.addEventListener("message", listener);
                    const timer = setInterval(() => {
                      if (!frame.isConnected || frame.hidden) { clearInterval(timer); window.removeEventListener("message", listener); return; }
                      frame.contentWindow?.postMessage(JSON.stringify({ event: "command", func: "getCurrentTime", args: [] }), "https://www.youtube-nocookie.com");
                      let index = -1; for (let i = 0; i < lines.length; i++) if (lines[i].at <= seconds) index = i; else break;
                      if (index !== lastIndex) { lastIndex = index; lyric.textContent = index < 0 ? "" : lines[index].text; }
                    }, 400);
                  };
                }
              }
            })
            .catch(error => err(error?.message || "No se pudo acceder a la tarjeta."));
          return;
        }
        const p = q.get("p");
        if (p) {
          if (!publicRe.test(p)) {
            err("Identificador de playlist inválido.");
            return;
          }
          fetch(`/music-cards/${encodeURIComponent(p)}.json`, {
            cache: "no-store",
          })
            .then(async (r) => {
              if (!r.ok)
                throw new Error(
                  `La ficha pública no está disponible (HTTP ${r.status}).`,
                );
              const contentType = (
                r.headers.get("content-type") || ""
              ).toLowerCase();
              if (!contentType.includes("json"))
                throw new Error(
                  "La ficha JSON de esta playlist no está publicada en Netlify. Descárgala desde Shopp, cópiala a public/music-cards/ y vuelve a desplegar.",
                );
              try {
                return await r.json();
              } catch {
                throw new Error(
                  "La ficha publicada no contiene un JSON válido.",
                );
              }
            })
            .then((data) => {
              if (
                data.schema !== "shopp-public-music-card" ||
                data.version !== 1 ||
                data.id !== p ||
                !Array.isArray(data.tracks)
              )
                throw new Error("Formato de playlist no válido.");
              const track = data.tracks.find(
                (x) =>
                  videoRe.test(x.videoId || "") ||
                  listRe.test(x.playlistId || ""),
              );
              if (!track) throw new Error("Playlist sin vídeos válidos.");
              show(
                data.title,
                data.author,
                videoRe.test(track.videoId || "") ? track.videoId : "",
                listRe.test(track.playlistId || "") ? track.playlistId : "",
                `${data.tracks.length} temas · ${data.collectionType === "classical" ? "Classical Music" : "Music Playlist"}`,
              );
            })
            .catch((e) =>
              err(
                e instanceof TypeError
                  ? "No se pudo acceder a la ficha pública. Comprueba la conexión y el despliegue."
                  : e.message,
              ),
            );
        } else {
          const v = q.get("v") || "",
            list = q.get("ytpl") || "";
          if (!videoRe.test(v) && !listRe.test(list)) {
            err("El QR no contiene un vídeo válido.");
            return;
          }
          show(
            q.get("t"),
            q.get("a"),
            videoRe.test(v) ? v : "",
            listRe.test(list) ? list : "",
            "",
          );
        }
      })();
    </script>
  </body>
</html>
