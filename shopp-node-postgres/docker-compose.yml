services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopp}
      POSTGRES_USER: ${POSTGRES_USER:-shopp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shopp}
      POSTGRES_USER: ${POSTGRES_USER:-shopp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_CHALLENGE_SECRET: ${AUTH_CHALLENGE_SECRET:-}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-shopp-api}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-shopp-client}
      CONVEX_NODE_BRIDGE_SECRET: ${CONVEX_NODE_BRIDGE_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
